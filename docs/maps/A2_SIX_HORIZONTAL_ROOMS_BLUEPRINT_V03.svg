<text x="42" y="52" fill="#f2f0e8" font-size="31" font-weight="700">NEREIS-HERO · A2 雾林与钟墓</text>
<text x="42" y="83" fill="#b7c5c8" font-size="18">六个独立横向关卡蓝图 v0.3 · 关卡职责示意，不是最终碰撞坐标</text>
<text x="42" y="119" fill="#e8c47a" font-size="17">原则：总图决定关系；单房间图决定怎么玩。每间都有可读的主地面，主题变化体现在地表、结构与背景。</text>
