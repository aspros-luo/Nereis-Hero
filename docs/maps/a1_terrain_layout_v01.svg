<text x="94" y="1040" font-family="Noto Sans CJK SC,sans-serif" font-size="14" fill="#66717c">本图为首轮地形布局草案；精确平台、墙体、跳跃间距与场景边界需下一轮细化。内部连接代表连续地形，不是独立传送门。</text></svg>