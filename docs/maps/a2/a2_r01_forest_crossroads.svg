<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>A2-R01 雾林岔路 — 手工绘制地形草图</title>
  <desc>Editable vector terrain plan, not AI-generated. Left entrance from A1; east route to Bell Tomb; elevated north route to Canopy Bridge; lower return loop.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101d25"/><stop offset="1" stop-color="#1c2b2d"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#778078"/><stop offset="1" stop-color="#394744"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c3c8b8" stroke-opacity=".07" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#d9c69a"/></marker>
    <style>
