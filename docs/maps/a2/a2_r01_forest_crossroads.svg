      .ledge{fill:#59675e;stroke:#a7b0a0;stroke-width:2.5;stroke-linejoin:round}
      .label{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#e9e4d5;font-size:23px}
      .small{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#c9d0c2;font-size:17px}
      .route{fill:none;stroke:#d9c69a;stroke-width:4;stroke-dasharray:10 9;marker-end:url(#arrow)}
      .secret{fill:none;stroke:#91b6a2;stroke-width:3;stroke-dasharray:5 8}
      .gate{fill:#1a2524;stroke:#d9c69a;stroke-width:3}
    </style>
  </defs>
