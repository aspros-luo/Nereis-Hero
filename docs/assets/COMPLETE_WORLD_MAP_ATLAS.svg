    .subheading { font-size: 16px; fill: #5e6871; }
    .layer { font-size: 20px; font-weight: 700; letter-spacing: 2px; fill: #59656f; }
    .zone { stroke: #34414a; stroke-width: 1.5; }
    .zoneid { font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #fffdf8; }
    .zonetitle { font-size: 19px; font-weight: 700; fill: #fffdf8; }
    .place { font-size: 14px; fill: #26313a; }
    .route { fill: none; stroke: #4d5962; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
    .shortcut { fill: none; stroke: #986e42; stroke-width: 4; stroke-dasharray: 10 9; stroke-linecap: round; stroke-linejoin: round; opacity: .95; }
    .optional { fill: none; stroke: #6c7480; stroke-width: 3; stroke-dasharray: 3 8; stroke-linecap: round; stroke-linejoin: round; }
    .legend { font-size: 15px; fill: #414c55; }
    .note { font-size: 14px; fill: #656f77; }
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#4d5962"/>
  </marker>
  <marker id="shortarrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#986e42"/>
  </marker>
</defs>
