<text x="90" y="1260" class="note">框内列出的是地图子区划候选，并非逐个 Godot 场景。</text>
<text x="90" y="1283" class="note">箭头和线条表示连接意图，不按比例；实际能力门槛需盘点现有技能解锁顺序后确定。</text>

<text x="60" y="1374" class="subheading">设计目标：玩家逐渐学会王国的地理，而不是依次选择章节。普通路线可错过深层真相；捷径应改变回程与空间认知。</text>
<text x="60" y="1403" class="subheading">文档基准：docs/COMPLETE_WORLD_MAP_ATLAS_CN.md · Nereis Hero · Draft 1.0</text>
