<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1480" viewBox="0 0 1900 1480" role="img" aria-labelledby="title desc">
<title id="title">Nereis Hero 完整世界地图区划示意图</title>
<desc id="desc">十四个主要区域的空间布局，分为地表高地、中层城市和地下深层，展示主路线与后期开启的捷径。</desc>
<defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #26313a; }
